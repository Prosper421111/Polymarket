<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #020617; }
    .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body class="text-slate-200 min-h-screen pb-20">

<div class="max-w-6xl mx-auto px-4 pt-10">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-3">
        <i data-lucide="shield-check" class="text-emerald-500 w-8 h-8"></i>
        Admin Dashboard
      </h1>
      <p class="text-slate-500 mt-1">Intelligence management for Polymarket Submissions</p>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="downloadPDF()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-xl font-semibold transition-all border border-slate-700">
        <i data-lucide="download" class="w-4 h-4 text-emerald-400"></i> Export PDF
      </button>
      <button onclick="deleteAll()" class="flex items-center gap-2 bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white px-5 py-2.5 rounded-xl font-semibold transition-all border border-red-500/20">
        <i data-lucide="trash-2" class="w-4 h-4"></i> Delete All
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
    <div class="glass p-6 rounded-2xl">
      <p class="text-slate-500 text-sm font-semibold uppercase tracking-wider">Total Captures</p>
      <h2 id="totalCaptures" class="text-4xl font-bold text-white mt-2">0</h2>
    </div>
    <div class="glass p-6 rounded-2xl border-l-4 border-l-emerald-500">
      <p class="text-slate-500 text-sm font-semibold uppercase tracking-wider">Database Status</p>
      <h2 class="text-xl font-bold text-emerald-400 mt-2">Live & Active</h2>
    </div>
    <div class="glass p-6 rounded-2xl">
      <p class="text-slate-500 text-sm font-semibold uppercase tracking-wider">Storage File</p>
      <h2 class="text-xl font-bold text-slate-300 mt-2">submissions.txt</h2>
    </div>
  </div>

  <div class="glass rounded-3xl overflow-hidden">
    <div class="p-6 border-b border-slate-800 flex items-center justify-between">
      <h3 class="font-bold text-lg">Recent Submissions</h3>
      <button onclick="refreshTable()" class="text-emerald-500 hover:text-emerald-400 text-sm font-bold flex items-center gap-2">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh
      </button>
    </div>
    <div class="overflow-x-auto">
      <table id="logsTable" class="w-full text-left">
        <thead class="bg-slate-900/50 text-slate-500 text-xs uppercase font-bold tracking-widest">
          <tr>
            <th class="py-5 px-8">Captured At</th>
            <th class="py-5 px-8">Country</th>
            <th class="py-5 px-8">Email Address</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800">
          <!-- Logs injected by JS -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();

  // Simulated submissions storage in browser
  let submissions = [];

  function refreshTable() {
    const tbody = document.querySelector("#logsTable tbody");
    tbody.innerHTML = "";
    document.getElementById("totalCaptures").innerText = submissions.length;
    if(submissions.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" class="py-20 text-center text-slate-600 italic">No data available in the logs.</td></tr>`;
      return;
    }
    submissions.slice().reverse().forEach(entry => {
      const tr = document.createElement("tr");
      tr.classList.add("hover:bg-white/[0.02]", "transition-colors");
      tr.innerHTML = `
        <td class="py-5 px-8 font-mono text-xs text-slate-400">${entry.dateTime}</td>
        <td class="py-5 px-8"><span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">${entry.country}</span></td>
        <td class="py-5 px-8 font-semibold text-slate-100">${entry.email}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function deleteAll() {
    if(confirm("Are you sure you want to permanently delete all submissions? This cannot be undone.")) {
      submissions = [];
      refreshTable();
    }
  }

  async function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(18);
    doc.text("Polymarket Submission Logs", 14, 22);
    doc.setFontSize(11);
    doc.setTextColor(100);
    doc.text("Exported on: " + new Date().toLocaleString(), 14, 30);
    doc.autoTable({
      head: [['Captured At', 'Country', 'Email']],
      body: submissions.map(e => [e.dateTime, e.country, e.email]),
      startY: 40,
      theme: 'striped',
      headStyles: { fillColor: [16, 185, 129] },
      styles: { fontSize: 9 }
    });
    doc.save("submissions_report_" + Date.now() + ".pdf");
  }

  // Initialize table
  refreshTable();

  // Example: simulate new submissions (replace with form POST capture)
  submissions.push({dateTime: new Date().toLocaleString(), country: "USA", email: "example@mail.com"});
  refreshTable();
</script>
</body>
</html>
